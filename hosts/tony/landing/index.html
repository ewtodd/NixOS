<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tv</title>
<style>
  :root { --bg:#0b0d10; --fg:#e8eaed; --dim:#8b949e; --focus:#4da3ff; }
  * { box-sizing: border-box; }
  html,body { height:100%; margin:0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 400 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display:flex; flex-direction:column; justify-content:center;
    padding: 4vh 5vw; gap: 4vh;
  }
  h1 { font-size: clamp(20px, 2.2vw, 34px); font-weight: 600; margin:0; color: var(--dim); letter-spacing:.02em; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: clamp(16px, 2vw, 32px); }
  a.tile {
    display:flex; flex-direction:column; justify-content:flex-end;
    aspect-ratio: 16/9; padding: clamp(16px,1.6vw,28px);
    border-radius: 14px; text-decoration:none; color: var(--fg);
    background: #161a20; border: 2px solid transparent;
    transition: transform .12s ease, border-color .12s ease, background .12s ease;
  }
  a.tile:hover { background:#1d222a; transform: scale(1.02); }
  /* Focus ring is deliberately loud: this has to be readable from a sofa, and
     it is the only affordance a D-pad or air-mouse user gets. */
  a.tile:focus-visible, a.tile:focus {
    outline: none; border-color: var(--focus);
    background:#1d222a; transform: scale(1.04);
    box-shadow: 0 0 0 6px rgba(77,163,255,.18);
  }
  .name { font-size: clamp(20px, 2vw, 30px); font-weight: 600; }
  .note { font-size: clamp(12px, 1vw, 15px); color: var(--dim); margin-top:.25em; }
  footer { color:#5a626b; font-size: clamp(11px,.9vw,14px); }
  kbd { background:#20262e; border-radius:4px; padding:1px 6px; font-family:inherit; }
</style>

<h1>tv</h1>

<nav class="grid">
  <a class="tile" href="https://play.max.com/" accesskey="1">
    <span class="name">Max</span>
    <span class="note">720p — Widevine L3 on Linux</span>
  </a>
  <a class="tile" href="https://www.youtube.com/tv" accesskey="2">
    <span class="name">YouTube</span>
    <span class="note">TV interface — D-pad navigable</span>
  </a>
  <a class="tile" href="https://www.youtube.com/" accesskey="3">
    <span class="name">YouTube (desktop)</span>
    <span class="note">full site, pointer</span>
  </a>
  <a class="tile" href="https://www.netflix.com/" accesskey="4">
    <span class="name">Netflix</span>
    <span class="note">720p — Widevine L3</span>
  </a>
</nav>

<footer>
  <kbd>Alt</kbd>+<kbd>Home</kbd> back here &nbsp;·&nbsp;
  <kbd>Alt</kbd>+<kbd>←</kbd> back &nbsp;·&nbsp;
  <kbd>Tab</kbd> move &nbsp;·&nbsp; <kbd>F11</kbd> fullscreen
</footer>

<script>
  // Land on the first tile so a remote can start moving immediately without
  // anyone having to find a pointer first.
  addEventListener('DOMContentLoaded', () => document.querySelector('a.tile')?.focus());
  // Arrow keys as well as Tab: a D-pad sends arrows, not tabs.
  addEventListener('keydown', e => {
    const tiles = [...document.querySelectorAll('a.tile')];
    const i = tiles.indexOf(document.activeElement);
    if (i < 0 || !['ArrowRight','ArrowLeft','ArrowDown','ArrowUp'].includes(e.key)) return;
    const cols = getComputedStyle(document.querySelector('.grid')).gridTemplateColumns.split(' ').length;
    const step = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols }[e.key];
    const next = tiles[Math.max(0, Math.min(tiles.length - 1, i + step))];
    if (next) { next.focus(); e.preventDefault(); }
  });
</script>
