<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tony</title>
<style>
  :root { --bg:#0b0d10; --fg:#e8eaed; --focus:#4da3ff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2vmin;
    padding: 2vmin;
    font: 600 16px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  /* One row on a portrait or narrow display; the TV will always be the two-up
     case, but this keeps it sane if it is ever driven from something else. */
  @media (max-aspect-ratio: 1/1) {
    body { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  }

  a.tile {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 3vmin;
    text-decoration: none;
    color: var(--fg);
    background: #161a20;
    border: 0.5vmin solid transparent;
    transition: transform .12s ease, border-color .12s ease, background .12s ease;
  }
  a.tile:hover { background: #1d222a; }

  /* Deliberately loud. Read from a sofa, and with Vimium-C or a D-pad this
     focus ring is the only thing telling you where you are. */
  a.tile:focus, a.tile:focus-visible {
    outline: none;
    border-color: var(--focus);
    background: #1d222a;
    transform: scale(1.02);
    box-shadow: 0 0 0 1.2vmin rgba(77,163,255,.20);
  }

  .name {
    font-size: 11vmin;
    letter-spacing: -0.01em;
    line-height: 1;
  }
</style>

<a class="tile" href="https://play.max.com/"><span class="name">Max</span></a>
<a class="tile" href="https://www.youtube.com/"><span class="name">YouTube</span></a>

<script>
  // Focus the first tile so a remote or keyboard can move immediately, without
  // anyone hunting for a pointer first.
  addEventListener('DOMContentLoaded', () => document.querySelector('a.tile').focus());

  // A D-pad sends arrows, not tabs. Two tiles, so any axis just toggles.
  addEventListener('keydown', e => {
    if (!['ArrowRight','ArrowLeft','ArrowUp','ArrowDown'].includes(e.key)) return;
    const tiles = [...document.querySelectorAll('a.tile')];
    const i = tiles.indexOf(document.activeElement);
    tiles[(i + 1) % tiles.length].focus();
    e.preventDefault();
  });
</script>
